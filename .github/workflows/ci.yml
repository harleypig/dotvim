name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on master are
# never cancelled, so every merge gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# bats and its libraries, each fetched by the commit its release tag points
# at, so a moved tag cannot change what CI runs.
env:
  BATS_CORE_SHA: 3bca150ec86275d6d9d5a4fd7d48ab8b6c6f3d87 # v1.13.0
  BATS_SUPPORT_SHA: 24a72e14349690bcbf7c151b9d2d1cdd32d36eb1 # v0.3.0
  BATS_ASSERT_SHA: f1e9280eaae8f86cbe278a687e6ba755bc802c1a # v2.2.4

jobs:
  bats-shell:
    name: bats tests/shell
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bats
        run: |
          root=$RUNNER_TEMP/bats
          fetch() {
            git init -q "$3"
            git -C "$3" fetch -q --depth 1 "https://github.com/bats-core/$1.git" "$2"
            git -C "$3" checkout -q --detach FETCH_HEAD
          }
          fetch bats-core "$BATS_CORE_SHA" "$root/src/bats-core"
          "$root/src/bats-core/install.sh" "$root"
          fetch bats-support "$BATS_SUPPORT_SHA" "$root/lib/bats-support"
          fetch bats-assert "$BATS_ASSERT_SHA" "$root/lib/bats-assert"
          echo "$root/bin" >> "$GITHUB_PATH"
          echo "BATS_LIB_PATH=$root/lib" >> "$GITHUB_ENV"

      - name: Run bats
        # The runner starts steps with SIGPIPE ignored, which a terminal
        # never does; a `cmd | head` pipeline in bin/ then never ends.
        run: env --default-signal=PIPE bats tests/shell

  bats-vim:
    name: bats tests/vim
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The tests load the plugins, so the submodules are needed. Node is
      # deliberately absent: the suite stubs it per test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Install bats
        run: |
          root=$RUNNER_TEMP/bats
          fetch() {
            git init -q "$3"
            git -C "$3" fetch -q --depth 1 "https://github.com/bats-core/$1.git" "$2"
            git -C "$3" checkout -q --detach FETCH_HEAD
          }
          fetch bats-core "$BATS_CORE_SHA" "$root/src/bats-core"
          "$root/src/bats-core/install.sh" "$root"
          fetch bats-support "$BATS_SUPPORT_SHA" "$root/lib/bats-support"
          fetch bats-assert "$BATS_ASSERT_SHA" "$root/lib/bats-assert"
          echo "$root/bin" >> "$GITHUB_PATH"
          echo "BATS_LIB_PATH=$root/lib" >> "$GITHUB_ENV"

      - name: Show Vim version
        run: vim --version | head -n 3

      - name: Run bats
        run: env --default-signal=PIPE bats tests/vim

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the repository's own Markdown: git ls-files never lists files
      # inside a submodule, so the plugins' docs are not linted.
      - name: Run markdownlint
        run: git ls-files -z '*.md' | xargs -0 npx --yes markdownlint-cli@0.48.0
