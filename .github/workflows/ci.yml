name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

# A new push to a pull request cancels its older run. A group holds only
# one pending run, so master runs must not share one: each gets its own
# (the run ID), and every merge gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bats-shell:
    name: bats tests/shell
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bats
        uses: ./.github/actions/setup-bats

      - name: Run bats
        run: bats tests/shell

  bats-vim:
    name: bats tests/vim
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The tests load the plugins, so the submodules are needed. Node is
      # deliberately absent: the suite stubs it per test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Install bats
        uses: ./.github/actions/setup-bats

      # sh-ftplugin.bats runs ALE's shfmt command and skips without it.
      # The release binary, not Ubuntu's older package, checked against the
      # SHA-256 GitHub records for the release asset.
      - name: Install shfmt
        env:
          SHFMT_VERSION: v3.14.1
          SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
        run: |
          dir=$RUNNER_TEMP/shfmt
          mkdir -p "$dir"
          curl -fsSL -o "$dir/shfmt" \
            "https://github.com/mvdan/sh/releases/download/$SHFMT_VERSION/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "$SHFMT_SHA256  $dir/shfmt" | sha256sum -c -
          chmod +x "$dir/shfmt"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Show Vim version
        run: vim --version | head -n 3

      - name: Run bats
        run: bats tests/vim

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the repository's own Markdown: git ls-files never lists files
      # inside a submodule, so the plugins' docs are not linted.
      # The upstream image is pinned by digest, so markdownlint-cli, its
      # dependency tree and the Node that runs it are all fixed here.
      - name: Run markdownlint
        env:
          MARKDOWNLINT_IMAGE: ghcr.io/igorshubovych/markdownlint-cli@sha256:c97f19b52cf7371ff767c080e3e15c15f1cbd3336fc41aeca7a93bb2cdb9843c # v0.48.0
        run: |
          git ls-files -z '*.md' |
            xargs -0 docker run --rm -v "$PWD:/workdir:ro" "$MARKDOWNLINT_IMAGE"
